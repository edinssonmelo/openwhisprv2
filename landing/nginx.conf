# CF-IPCountry comes from the existing Cloudflare edge. No external geolocation service.
map $http_cf_ipcountry $visitor_country {
    default "";
    ~^[A-Za-z][A-Za-z]$ $http_cf_ipcountry;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /locale.json {
        default_type application/json;
        add_header Cache-Control "no-store, private" always;
        return 200 '{"country":"$visitor_country"}';
    }
    location = /releases/latest.json {
        alias /srv/releases/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    location /releases/ {
        alias /srv/releases/;
        autoindex off;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=3600";
        limit_except GET HEAD { deny all; }
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
